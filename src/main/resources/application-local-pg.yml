# ==============================================================================
# StepStyle Footwear Store - Local PostgreSQL Profile
# Use this when Supabase is unavailable or for offline local PostgreSQL development
# Activate by setting in .env:
#   SPRING_PROFILES_ACTIVE=local-pg
# Or passing JVM flag:
#   -Dspring.profiles.active=local-pg
# ==============================================================================

spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

app:
  admin:
    bootstrap:
      enabled: true
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@stepstyle.com}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:Password@123}
      first-name: ${ADMIN_BOOTSTRAP_FIRST_NAME:System}
      last-name: ${ADMIN_BOOTSTRAP_LAST_NAME:Administrator}
  mail:
    dev-mode: true
